map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: "/Users/mdayaan/dev_ws/src/bot_one/config/maze_map.yaml"

amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    scan_topic: /scan
    tf_broadcast: true
    transform_tolerance: 1.0

    min_particles: 100
    max_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    update_min_d: 0.1
    update_min_a: 0.2

    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    laser_model_type: "likelihood_field"
    laser_min_range: -1.0
    laser_max_range: 12.0
    max_beams: 60
    z_hit: 0.5
    z_rand: 0.5
    z_short: 0.05
    z_max: 0.05
    sigma_hit: 0.2
    do_beamskip: false

    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
